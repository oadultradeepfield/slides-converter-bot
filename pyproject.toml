[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slides-converter-bot"
version = "0.1.0"
description = "Telegram bot that turns slide PDFs into annotation-friendly notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pypdf>=6.0",
    "reportlab>=4.4",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PTH",
    "ANN",
    "PL",
    "RUF",
]
ignore = [
    "ANN401",
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
warn_unreachable = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

